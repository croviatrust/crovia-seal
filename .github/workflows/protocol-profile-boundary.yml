name: protocol-profile-boundary

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master]

jobs:
  profile-boundary:
    name: "Legacy / draft-01 fail-closed boundary"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reference and test runner
        run: |
          python -m pip install -e reference/python
          python -m pip install pytest

      - name: Test protocol profile classification
        working-directory: integrations/seal-svc
        run: python -m pytest tests/test_protocol_profiles.py -v

      - name: Compile the production service
        run: python -m py_compile integrations/seal-svc/app.py integrations/seal-svc/protocol_profiles.py

      - name: Reject legacy emission in source
        run: |
          if grep -R --line-number --fixed-strings '"seal_version": "crovia-seal-v1"' \
              integrations/seal-svc --include='*.py' --exclude='test_*.py'; then
            echo "::error::The production service still contains a legacy emitter."
            exit 1
          fi
